<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunglasses Shortlist</title><style>*{box-sizing:border-box}body{margin:0;background:#101116;color:#faf9f8;font:16px system-ui,Arial}main{max-width:1100px;min-height:100dvh;padding:20px;margin:auto;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;color:#b3bfd0;font-size:12px;letter-spacing:2px;font-weight:700}h1{font-size:clamp(28px,5vw,46px);margin:20px 0 6px}h2{color:#bbc1cc;font-size:18px;font-weight:400;margin:0 0 16px}.stage{flex:1;min-height:320px;background:#f9f9f8;border-radius:20px;display:grid;place-items:center;overflow:hidden}.stage img{width:95%;max-height:57vh;object-fit:contain}.fallback{color:#303742;padding:30px;text-align:center;display:none}p{color:#acb4c2}footer{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,a{border:1px solid #596577;border-radius:30px;background:#262c37;color:white;padding:13px 20px;font-weight:700;text-decoration:none;cursor:pointer}a{background:#dbeaff;color:#152036;margin-left:auto}.dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:16px}.dots span{height:8px;width:8px;background:#565b64;border-radius:8px;cursor:pointer}.dots span.on{background:#e3edff;width:22px}@media(max-width:560px){main{padding:14px}.stage{min-height:250px}button,a{padding:12px 14px}a{margin-left:0}}</style></head><body><main><header><span>YOUR SUNGLASSES SHORTLIST</span><span id="count"></span></header><h1 id="title"></h1><h2 id="sub"></h2><section class="stage" id="stage"><img id="img"><div class="fallback" id="fallback">Photo unavailable in the web edition.<p>View the original slideshow to see the user-selected Carrera lens color images.</p></div></section><p id="note"></p><div class="dots" id="dots"></div><footer><button id="prev">← Previous</button><button id="next">Next →</button><button id="auto">▶ Autoplay</button><a id="link" rel="noopener" target="_blank">View model ↗</a></footer><p style="font-size:12px">Swipe or use arrow keys to navigate. Colorways may differ. Retailer photos load over the internet.</p></main><script>const slides=[["Emporio Armani","EA4279U","51/53 mm · matte black pilot","https://assets.lenscrafters.com/is/image/LensCrafters/8056262970447__STD__shad__fr.png","https://www.lenscrafters.com/lc-us/emporio-armani/8056262970447"],["Oakley","Clifden","54 mm · mountaineering","https://goatjump.com/cdn/shop/files/8468023a-d648-4e9b-b249-8dfe4098748f.jpg?v=1764253593","https://www.lenscrafters.com/lc-us/oakley/888392675422"],["Ray-Ban","Marshall II · RB3648M","52 mm · double bridge","https://media.visionet-online.de/oscommerce/images/viewerxxl_new/ray-ban-The-Marshal-II-RB3648M-9240B1-52__P21__shad__fr.jpg","https://www.ray-ban.com/usa/sunglasses/RB3648Mmarshal%2Bii-arista%2Bgold/8056597073165"],["Ray-Ban","Cats 5000 · RB4125","59 mm · retro pilot","https://cdn1.visiofactory.com/146366/zonnebrillen-ray-ban-cats-5000-rb4125-601-r5-59-13-black.jpg","https://www.visiofactory.nl/zonnebrillen/alle-zonnebrillen/ray-ban-cats-5000-rb4125-601-r5-59-13-black.html"],["Ray-Ban","Bill · RB2198","56 mm · bold square pilot","https://images.ray-ban.com/is/image/RayBan/8056597529723_0000.png?impolicy=SEO_1x1","https://www.ray-ban.com/denmark/sunglasses/RB2198bill-black/8056597529723"],["Carrera","CA256/S","Ruthenium black · geometric pilot","","https://www.eye-shop.eu/eye-shop/gr/en_products_sun_det/87907/carrera_sunglasses/carrera-carrera-256s-sunglasses.html"],["Carrera","CA5046/S","49 mm · round acetate","https://www.fashioneyewear.com/cdn/shop/products/0001_CA5046S807QT49_90543702-19ec-4c9a-9ea6-01e2b54c6b49.jpg?v=1647355215","https://www.fashioneyewear.com/en-us/products/carrera-5046-s"],["Carrera","CA256/S · Bronze","Lens color comparison · original images in downloadable version","",""],["Carrera","CA256/S · Grey","Lens color comparison · original images in downloadable version","",""],["Carrera","CA256/S · Green","Lens color comparison · original images in downloadable version","",""]];let i=0,t=null;const $=x=>document.getElementById(x);function show(){let s=slides[i];$('count').textContent=(i+1)+' / '+slides.length;$('title').textContent=s[0]+' '+s[1];$('sub').textContent=s[2];$('note').textContent=s[3]?'Reference product image':'Exact color render available in original downloadable slideshow';$('img').style.display=s[3]?'block':'none';$('fallback').style.display=s[3]?'none':'block';$('img').src=s[3]||'';$('img').onerror=()=>{$('img').style.display='none';$('fallback').style.display='block'};$('link').style.display=s[4]?'inline-flex':'none';$('link').href=s[4]||'#';$('dots').innerHTML=slides.map((_,j)=>'<span data-i="'+j+'" class="'+(j===i?'on':'')+'"></span>').join('');document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{i=+x.dataset.i;show()})}function step(n){i=(i+n+slides.length)%slides.length;show()}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('auto').onclick=()=>{if(t){clearInterval(t);t=null;$('auto').textContent='▶ Autoplay'}else{t=setInterval(()=>step(1),3500);$('auto').textContent='❚❚ Pause'}};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});let x=0;$('stage').addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});$('stage').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>50)step(d<0?1:-1)},{passive:true});show();</script></body></html>
